dataset:
  train_images:       data/processed/train/images
  train_annotations:  data/processed/annotations/train.json
  val_images:         data/processed/val/images
  val_annotations:    data/processed/annotations/val.json

model:
  num_classes: 9        # 8 traffic classes + 1 background (class 0)
  batch_size: 4         # 4–8 recommended for T4 (16 GB); raise to 8 if VRAM allows
  epochs: 20
  learning_rate: 0.005  # LR decays ×0.1 at epoch 12 and 17 (60 % / 85 % of total)
  num_workers: 2
  val_every: 5          # run validation mAP every N epochs (set to 1 for full tracking)

save_dir: models/faster_rcnn